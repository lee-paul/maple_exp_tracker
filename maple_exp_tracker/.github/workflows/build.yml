name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name MapleTracker --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime maple_exp_tracker.py
      - run: Compress-Archive -Path dist/MapleTracker -DestinationPath MapleTracker-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: MapleTracker-windows, path: MapleTracker-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: MapleTracker-windows.zip }
